<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="程掌柜·酒店投融尽调 Agent — GOAI 无界应用公开 Demo">
  <title>程掌柜 - 酒店投资经营军师</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-grid" id="app-grid">
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="打开菜单"><i class="fa fa-bars"></i></button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside id="sidebar" class="project-nav">
      <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="关闭菜单"><i class="fa fa-times"></i></button>

      <div class="brand-block">
        <div class="brand-avatar">程</div>
        <div>
          <h1>程掌柜</h1>
          <p>酒店投资经营军师</p>
        </div>
      </div>

      <div class="sidebar-scroll">
        <button id="new-conversation-btn" class="new-chat-btn"><i class="fa fa-plus"></i><span>发起新咨询</span></button>

        <section class="sidebar-section">
          <h3><i class="fa fa-folder-open-o"></i>项目档案 <span id="project-count">2</span></h3>
          <select id="project-select">
            <option value="goai">厦门海湾城际酒店（演示）</option>
            <option value="default">默认项目</option>
          </select>
          <div class="project-actions">
            <button id="project-new-btn"><i class="fa fa-plus"></i> 新建</button>
            <button id="project-manage-btn"><i class="fa fa-archive"></i> 归档</button>
          </div>
        </section>

        <section class="sidebar-section">
          <h3>我的对话</h3>
          <div id="conversation-list" class="conversation-list"></div>
        </section>
      </div>

      <div class="user-block">
        <div class="user-avatar">G</div>
        <div class="user-copy"><strong>GOAI 评委体验</strong><span>公开演示模式</span></div>
        <span class="demo-dot" title="Demo"></span>
      </div>
    </aside>

    <div class="resizer resizer-left" role="separator" data-side="left"></div>

    <main id="chat-main">
      <header class="chat-header">
        <div class="header-title">
          <span class="header-title-icon"><i class="fa fa-comments"></i></span>
          <span class="header-title-text">对话工作台</span>
        </div>
        <div class="header-actions">
          <span class="goai-chip">GOAI · AI+金融</span>
          <button id="share-chat-btn" class="btn-secondary"><i class="fa fa-share-alt"></i><span>分享</span></button>
        </div>
      </header>

      <section class="chat-scroll" id="chat-scroll">
        <div class="chat-column">
          <div id="chat-history" class="chat-history"></div>
        </div>
      </section>

      <footer class="chat-footer">
        <div class="chat-column">
          <div id="attachment-strip" class="attachment-strip" aria-live="polite"></div>
          <div id="voice-status-demo" class="voice-status-demo" aria-live="polite"></div>
          <p class="disclaimer">程掌柜生成的观点仅供决策参考，投资有风险，入局需谨慎。</p>
          <form id="chat-form" class="input-dock">
            <button type="button" class="dock-plus-btn" aria-label="添加资料"><i class="fa fa-plus"></i></button>
            <div class="dock-input-wrap">
              <input id="user-input" class="dock-input" maxlength="500" autocomplete="off" placeholder="输入城市+物业情况，例如：我在厦门看一家80间房酒店，年租金238万…">
              <span id="dock-count" class="dock-count">0/500</span>
            </div>
            <button type="button" class="dock-icon-btn" aria-label="语音输入" title="语音输入"><i class="fa fa-microphone"></i></button>
            <button type="submit" class="dock-send-btn" aria-label="发送"><i class="fa fa-arrow-up"></i></button>
            <input id="demo-file-input" type="file" hidden multiple accept=".pdf,.xls,.xlsx,.csv,.tsv,.txt,.md,.json,.doc,.docx">
            <div id="attachment-menu" class="attachment-menu" aria-hidden="true">
              <button type="button" data-attach="upload"><i class="fa fa-upload"></i><span>上传资料</span></button>
              <button type="button" data-attach="demo"><i class="fa fa-magic"></i><span>加载演示材料</span></button>
              <button type="button" data-attach="project"><i class="fa fa-folder-open-o"></i><span>从项目选择</span></button>
            </div>
          </form>
        </div>
      </footer>
    </main>

    <div class="resizer resizer-right" role="separator" data-side="right"></div>

    <aside id="investment-workspace" aria-label="投资经营工作台">
      <div class="workspace-mode-tabs" role="tablist">
        <button class="workspace-mode-tab active" data-workspace-mode="investment"><i class="fa fa-briefcase"></i><span>投资分析</span></button>
        <button class="workspace-mode-tab" data-workspace-mode="operation"><i class="fa fa-line-chart"></i><span>经营分析</span></button>
      </div>
      <div class="workspace-header">
        <div>
          <div class="workspace-kicker">当前项目</div>
          <div class="workspace-project-name" id="workspace-project-name">厦门海湾城际酒店（演示）</div>
        </div>
        <button id="reset-demo-btn" class="workspace-icon-btn" title="重置演示"><i class="fa fa-refresh"></i></button>
      </div>
      <div class="workspace-stage-tabs" id="workspace-stage-tabs">
        <button class="stage-tab active" data-stage="data">资料</button>
        <button class="stage-tab" data-stage="diagnosis">诊断</button>
        <button class="stage-tab" data-stage="plan">方案</button>
        <button class="stage-tab" data-stage="conclusion">结论</button>
      </div>
      <div class="workspace-content" id="workspace-content"></div>
    </aside>
  </div>

  <nav class="mobile-bottom-tabs" id="mobile-bottom-tabs" aria-label="主要导航">
    <button class="tab-btn active" data-tab="chat"><i class="fa fa-comments"></i><span>对话</span></button>
    <button class="tab-btn" data-tab="investment"><i class="fa fa-briefcase"></i><span>投资分析</span></button>
    <button class="tab-btn" data-tab="operation"><i class="fa fa-line-chart"></i><span>经营分析</span></button>
    <button class="tab-btn" data-tab="project"><i class="fa fa-folder-open-o"></i><span>项目</span></button>
  </nav>

  <div class="mobile-workspace-overlay" id="mobile-workspace-overlay"></div>
  <script src="./app.js"></script>
  <script src="./demo-enhancements.js"></script>
</body>
</html>
