name: Deploy Hotel AI Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static demo
        shell: bash
        run: |
          node --check app.js
          test -f index.html
          test -f styles.css
          grep -q 'id="sidebar"' index.html
          grep -q 'id="chat-main"' index.html
          grep -q 'id="investment-workspace"' index.html
          grep -q '程掌柜 - 酒店投资经营军师' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
